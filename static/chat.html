<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=1">
<title>标小智 · 智能问答 · 6 Agent 协作</title>
<link rel="stylesheet" href="/static/vendor/phosphor/phosphor-icons.min.css?v=2">
<link rel="stylesheet" href="/static/css/bidagent.css?v=3">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-width:208px;--header-h:52px;
}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:13px;line-height:1.5715;overflow:hidden}

/* ===== Sidebar（复用全局墨档样式） ===== */
.sidebar{position:fixed;left:0;top:0;width:var(--sidebar-width);height:100vh;background:var(--sidebar-bg);display:flex;flex-direction:column;z-index:100}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-logo .logo-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.sidebar-logo .logo-text{color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section-label{padding:12px 20px 6px;font-size:10px;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:var(--sidebar-text);font-size:13px;text-decoration:none;transition:all .15s;border-left:3px solid transparent;cursor:pointer}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-item.active{color:#fff;background:rgba(var(--seal-rgb),.15);border-left-color:var(--sidebar-active)}
.nav-item i{font-size:16px;width:18px;text-align:center;flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:8px;background:var(--seal);color:#fff;font-weight:600}
.sidebar-footer{padding:10px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.3);line-height:1.6}
.sidebar-footer .comp-tag{font-weight:600}

/* ===== Main Wrap ===== */
.main-wrap{margin-left:var(--sidebar-width);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top-header{height:var(--header-h);background:var(--card-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.header-left{display:flex;align-items:center;gap:12px}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.header-title i{margin-right:6px}
.header-right{display:flex;align-items:center;gap:10px}
.h-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600}
.h-badge.comp{background:var(--primary-bg);color:var(--primary)}
.h-badge.data{background:var(--success-bg);color:var(--success)}
.h-badge.vers{background:var(--bg);color:var(--text-2);border:1px solid var(--border)}

/* ===== Chat Layout ===== */
.main-container{flex:1;display:flex;overflow:hidden;min-height:0}
.chat-panel{flex:1;display:flex;flex-direction:column;background:var(--card-bg);border-right:1px solid var(--border);min-width:0;min-height:0;overflow:hidden}
.chat-messages{flex:1 1 0;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px;min-height:0}
.message{max-width:75%;display:flex;gap:10px}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.message.user .avatar{background:var(--primary);color:#fff}
.message.bot .avatar{background:var(--primary-bg);color:var(--primary)}
.bubble{padding:12px 16px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
.message.user .bubble{background:var(--primary);color:#fff;border-top-right-radius:4px}
.message.bot .bubble{background:var(--bg);color:var(--text);border-top-left-radius:4px;border:1px solid var(--border)}
.slots-card{background:var(--primary-bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-top:10px}
.slots-title{font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:600}
.slots-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot-item{display:flex;flex-direction:column;gap:2px}
.slot-label{font-size:11px;color:var(--text-3)}
.slot-value{font-size:13px;color:var(--text);font-weight:500}
.slot-empty{color:var(--text-3);font-style:italic}
.report-card{background:var(--success-bg);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:10px;display:flex;align-items:center;gap:12px}
.report-icon{font-size:28px}
.report-info{flex:1}
.report-name{font-size:14px;font-weight:600;color:var(--success)}
.report-size{font-size:12px;color:var(--text-2);margin-top:2px}
.report-btn{padding:8px 16px;background:var(--success);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.report-btn:hover{background:var(--success);filter:brightness(.9)}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--border);background:var(--bg)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;transition:border-color .2s;background:var(--card-bg);color:var(--text)}
.input-row input:focus{border-color:var(--primary)}
.time-range-select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card-bg);color:var(--text);outline:none;cursor:pointer;flex-shrink:0}
.time-range-select:focus{border-color:var(--primary)}
.input-row button{padding:12px 24px;background:var(--primary);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500}
.input-row button:hover{background:var(--primary-hover)}
.input-row button:disabled{background:var(--text-3);cursor:not-allowed}
.input-hint{font-size:11px;color:var(--text-3);margin-top:8px}
.input-hint span{color:var(--primary);cursor:pointer;margin-right:8px}
.chat-clear-btn{font-size:11px;color:var(--text-3);cursor:pointer;margin-left:8px;text-decoration:underline}
.chat-clear-btn:hover{color:var(--error)}

/* ===== Agents Panel ===== */
.agents-panel{width:340px;background:var(--bg);display:flex;flex-direction:column;min-width:340px}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border)}
.panel-header h2{font-size:14px;color:var(--text)}
.panel-header h2 i{color:var(--primary)}
.panel-header .desc{font-size:12px;color:var(--text-3);margin-top:4px}
.agents-list{flex:1;overflow-y:auto;padding:12px}
.agent-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;transition:all .3s}
.agent-card.active{border-color:var(--primary);box-shadow:0 2px 8px rgba(var(--primary-rgb),.15)}
.agent-card.done{border-color:var(--success);background:var(--success-bg)}
.agent-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.agent-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--primary);background:var(--primary-bg)}
.agent-name{font-size:13px;font-weight:600;color:var(--text);flex:1}
.agent-status{font-size:11px;padding:2px 8px;border-radius:10px}
.status-pending{background:var(--bg);color:var(--text-3)}
.status-running{background:var(--primary-bg);color:var(--primary)}
.status-done{background:var(--success-bg);color:var(--success)}
.agent-desc{font-size:11px;color:var(--text-3);margin-bottom:8px;line-height:1.4}
.progress-bar{height:4px;background:var(--border-2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:2px;width:0;transition:width .5s ease}
.agent-card.done .progress-fill{background:var(--success)}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:6px;height:6px;background:var(--text-3);border-radius:50%;animation:bounce 1.4s infinite both}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
@media(max-width:1024px){.agents-panel{width:280px;min-width:280px}}
</style>
</head>
<body>
<!-- ===== Sidebar ===== -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">标</div>
    <div class="logo-text">标小智</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-section-label">主导航</div>
    <a href="/ui" class="nav-item"><i class="ph-bold ph-house"></i><span>工作台</span></a>
    <a href="/ui/search" class="nav-item"><i class="ph-bold ph-magnifying-glass"></i><span>招标检索</span></a>
    <a href="/ui/notice-list" class="nav-item"><i class="ph-bold ph-list-magnifying-glass"></i><span>跨平台去重</span></a>
    <a href="/ui/detail" class="nav-item"><i class="ph-bold ph-line-segment"></i><span>证据验证</span></a>
    <a href="/ui/org" class="nav-item"><i class="ph-bold ph-users-three"></i><span>组织画像</span></a>
    <a href="/ui/quality-dashboard" class="nav-item"><i class="ph-bold ph-chart-bar"></i><span>质量评测</span></a>
    <a href="/ui/versions" class="nav-item"><i class="ph-bold ph-git-branch"></i><span>版本历史</span></a>
    <div class="nav-section-label">辅助</div>
    <a href="/ui/chat" class="nav-item active"><i class="ph-bold ph-chats-circle"></i><span>智能问答</span><span class="nav-badge">AI</span></a>
  </nav>
  <div class="sidebar-footer">
    <div><span class="comp-tag">标小智</span> v4.1</div>
    <div>GOAI 2026 初赛 · W3</div>
  </div>
</aside>

<!-- ===== Main ===== -->
<div class="main-wrap">
  <header class="top-header">
    <div class="header-left">
      <div class="header-title"><i class="ph-bold ph-chats-circle"></i>智能问答</div>
    </div>
    <div class="header-right">
      <div class="h-badge comp"><i class="ph ph-trophy"></i>GOAI 2026</div>
      <div class="h-badge data"><i class="ph ph-database"></i>真实数据 · W3</div>
      <div class="h-badge vers">v4.1 · 107篇</div>
    </div>
  </header>
  <div class="content-area" style="flex:1 1 0;padding:0;overflow:hidden;min-height:0">

<div class="main-container">
  <section class="chat-panel">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="输入你的需求，例如：找上海最近7天的IT采购项目"
               onkeydown="if(event.key==='Enter')sendMsg()">
        <select id="timeRangeSelect" class="time-range-select" title="选择时间范围">
          <option value="最近30天">近30天</option>
          <option value="最近1天">近1天</option>
          <option value="最近5天">近5天</option>
          <option value="最近15天">近15天</option>
          <option value="最近3个月">近3个月</option>
        </select>
        <button id="sendBtn" onclick="sendMsg()">发送</button>
      </div>
      <div class="input-hint">
        快捷示例：
        <span onclick="setInput('找上海最近7天的IT采购项目')">上海 IT 采购</span>
        <span onclick="setInput('北京教育系统的中标公告')">北京 教育 中标</span>
        <span onclick="setInput('广东省医疗设备招标')">广东 医疗设备</span>
        <span class="chat-clear-btn" onclick="clearChatHistory()">清空记录</span>
      </div>
    </div>
  </section>
  <aside class="agents-panel">
    <div class="panel-header"><h2><i class="ph-bold ph-robot" style="margin-right:6px"></i>Agent 协作流水线</h2><div class="desc">6 个专业 Agent 实时运行状态（功能面板）</div></div>
    <div class="agents-list" id="agentsList"></div>
  </aside>
</div>
<script>
/* ===== 聊天记录持久化（localStorage） ===== */
const CHAT_KEY='bidagent_chat_history';
const CHAT_MAX=50;

function saveChatMsg(role,content){
  try{
    const arr=JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');
    arr.push({role:role,content:content,ts:Date.now()});
    if(arr.length>CHAT_MAX)arr.splice(0,arr.length-CHAT_MAX);
    localStorage.setItem(CHAT_KEY,JSON.stringify(arr));
  }catch(e){}
}

function loadChatHistory(){
  try{
    return JSON.parse(localStorage.getItem(CHAT_KEY)||'[]');
  }catch(e){return []}
}

function clearChatHistory(){
  localStorage.removeItem(CHAT_KEY);
  document.getElementById('chatMessages').innerHTML='';
  addMsg('bot',
    '你好！我是标小智。<br><br>'+
    '告诉我你想找什么样的招标项目，我会通过 6 个 Agent 协作帮你：<br>'+
    '1. 理解意图 → 2. 搜集数据 → 3. 清洗处理 →<br>'+
    '4. 质量校验 → 5. 报告生成 → 6. 推送交付<br><br>'+
    '试试输入：<b>"找上海最近7天的IT采购项目"</b>',
    false
  );
}

const AGENTS=[
  {id:'intent',name:'意图理解 Agent',icon:'<i class="ph-bold ph-brain"></i>',desc:'解析用户意图，抽取5槽位参数',status:'pending',progress:0},
  {id:'collector',name:'数据采集 Agent',icon:'<i class="ph-bold ph-globe"></i>',desc:'多平台爬取招标公告数据',status:'pending',progress:0},
  {id:'processor',name:'清洗抽取 Agent',icon:'<i class="ph-bold ph-gear-six"></i>',desc:'LLM 抽取6类核心字段',status:'pending',progress:0},
  {id:'quality',name:'质量校验 Agent',icon:'<i class="ph-bold ph-shield-check"></i>',desc:'证据定位 + 反幻觉校验',status:'pending',progress:0},
  {id:'finance',name:'金融分析 Agent',icon:'<i class="ph-bold ph-chart-line-up"></i>',desc:'供应商公开活动观察信号分析',status:'pending',progress:0},
  {id:'delivery',name:'报告交付 Agent',icon:'<i class="ph-bold ph-paper-plane-tilt"></i>',desc:'生成 Word 报告并推送交付',status:'pending',progress:0},
];
let running=false;
function renderAgents(){
  document.getElementById('agentsList').innerHTML=AGENTS.map(a=>{
    const cc=a.status==='running'?' active':a.status==='done'?' done':'';
    const sl=a.status==='running'?'运行中':a.status==='done'?'已完成':'等待中';
    return `<div class="agent-card${cc}">
      <div class="agent-header">
        <div class="agent-icon">${a.icon}</div>
        <div class="agent-name">${a.name}</div>
        <span class="agent-status status-${a.status}">${sl}</span>
      </div>
      <div class="agent-desc">${a.desc}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${a.progress}%"></div></div>
    </div>`;
  }).join('');
}
function addMsg(role,content,persist){
  const c=document.getElementById('chatMessages');
  const m=document.createElement('div');
  m.className=`message ${role}`;
  m.innerHTML=`<div class="avatar">${role==='user'?'我':'AI'}</div><div class="bubble">${content}</div>`;
  c.appendChild(m);c.scrollTop=c.scrollHeight;
  if(persist!==false)saveChatMsg(role,content);
  return m;
}
function setInput(t){document.getElementById('msgInput').value=t}
const STAGE_AGENT_MAP={'intent':0,'collecting':1,'processing':2,'quality':3,'finance':4,'done':5};
let _pipelineSid=null;let _lastReportSid=null;
async function runReal(){
  AGENTS.forEach(a=>{a.status='pending';a.progress=0});renderAgents();
  for(let iter=0;iter<300;iter++){
    await new Promise(r=>setTimeout(r,1000));
    if(!_pipelineSid)break;
    try{
      const r=await fetch(`/api/demo/pipeline/status?sid=${encodeURIComponent(_pipelineSid)}`);
      if(!r.ok)continue;
      const d=await r.json();
      if(d.code!==200)continue;
      const s=d.data;
      const stages=s.stages||{};
      for(const [stageName,stageInfo] of Object.entries(stages)){
        const idx=STAGE_AGENT_MAP[stageName];
        if(idx===undefined)continue;
        if(stageInfo.status==='completed'||stageInfo.status==='done'){AGENTS[idx].status='done';AGENTS[idx].progress=100}
        else if(stageInfo.status==='running'){AGENTS[idx].status='running';AGENTS[idx].progress=Math.max(AGENTS[idx].progress,50)}
      }
      const curIdx=STAGE_AGENT_MAP[s.stage];
      if(curIdx!==undefined && AGENTS[curIdx].status==='running'){
        AGENTS[curIdx].progress=Math.min(95,AGENTS[curIdx].progress+5);
      }
      renderAgents();
      if(s.stage==='done' && s.finished_at){
        AGENTS.forEach(a=>{a.status='done';a.progress=100});renderAgents();
        return s;
      }
      if(s.error){return s}
    }catch(e){}
  }
  return null;
}
async function sendMsg(){
  if(running)return;
  const input=document.getElementById('msgInput');
  const btn=document.getElementById('sendBtn');
  const text=input.value.trim();if(!text)return;
  const _trSel=document.getElementById('timeRangeSelect');
  const _trWord=_trSel?_trSel.value:'';
  const fullQuery=_trWord?(text+' '+_trWord):text;
  running=true;btn.disabled=true;
  addMsg('user',text);input.value='';
  const botMsg=addMsg('bot','<div class="typing-dots"><span></span><span></span><span></span></div>');
  await new Promise(r=>setTimeout(r,600));
  const slots=parseSlots(fullQuery);
  const slotsHtml=`已解析你的需求，5 槽位参数如下：${renderSlots(slots)}<br>正在启动 6 个 Agent 协作处理，请稍候...`;
  botMsg.querySelector('.bubble').innerHTML=slotsHtml;
  saveChatMsg('bot',slotsHtml);
  try{
    const sr=await fetch(`/api/demo/pipeline/start?query=${encodeURIComponent(fullQuery)}`,{method:'POST'});
    const sd=await sr.json();
    if(sd.code===200 && sd.data.session_id){
      _pipelineSid=sd.data.session_id;
      const result=await runReal();
      const finalSid=_pipelineSid;
      _pipelineSid=null;
      if(!result||result.error){
        const errMsg=result&&result.error?result.error:'pipeline 执行失败';
        const failHtml=`<div style="color:var(--error)"><i class="ph-bold ph-warning"></i> 处理失败：${errMsg}</div>`+
          `<div style="font-size:12px;color:var(--text-3);margin-top:4px">请稍后重试，或检查查询条件是否合理</div>`;
        botMsg.querySelector('.bubble').innerHTML=failHtml;
        saveChatMsg('bot',failHtml);
        running=false;btn.disabled=false;input.focus();
        return;
      }
      const r=result.result||{};
      const cs=r.collect_summary||{};
      const ps=r.process_summary||{};
      const ds=r.delivery_summary||{};
      const foundCount=ds.total_tenders||cs.total||ps.total_processed||0;
      const reportPath=r.report_path||'';
      const rn=reportPath?reportPath.split(/[\\/]/).pop():`招标分析报告_${slots.keyword||'招标'}_${new Date().toISOString().slice(0,10)}.docx`;
      if(finalSid&&reportPath){_lastReportSid=finalSid}
      const hasReport=!!reportPath;
      const doneHtml=(foundCount>0?`处理完成！共找到 <b>${foundCount}</b> 条相关招标公告。`:`处理完成！`)+
        (hasReport?
        `<div class="report-card">
          <div class="report-icon"><i class="ph-bold ph-file-text" style="font-size:28px;color:var(--success)"></i></div>
          <div class="report-info">
            <div class="report-name">${rn}</div>
            <div class="report-size">Word 文档 · 真实 pipeline 生成 · 含项目列表+证据验证+金融信号</div>
          </div>
          <a href="#" class="report-btn" onclick="downloadReport();return false;">下载报告</a>
        </div>`
        :`<div style="font-size:12px;color:var(--text-3);margin-top:4px">未匹配到相关公告，未生成报告。请尝试更换关键词或扩大时间范围</div>`);
      botMsg.querySelector('.bubble').innerHTML=doneHtml;
      saveChatMsg('bot',doneHtml);
    }else{
      const failHtml2=`Pipeline 启动失败: ${sd.msg||'未知错误'}`;
      botMsg.querySelector('.bubble').innerHTML=failHtml2;
      saveChatMsg('bot',failHtml2);
    }
  }catch(e){
    const exHtml=`Pipeline 执行异常: ${e.message}`;
    botMsg.querySelector('.bubble').innerHTML=exHtml;
    saveChatMsg('bot',exHtml);
  }
  running=false;btn.disabled=false;input.focus();
}
function parseSlots(text){
  const s={keyword:'',region:'',time_range:'',industry:'',notice_type:''};
  s.keyword='由 AI 意图解析自动判别';
  s.region='由 AI 意图解析自动判别';
  const _trSel2=document.getElementById('timeRangeSelect');
  if(_trSel2){s.time_range=_trSel2.options[_trSel2.selectedIndex].text}
  else if(text.includes('7天')||text.includes('一周'))s.time_range='最近 7 天';
  else if(text.includes('30天')||text.includes('一个月'))s.time_range='最近 30 天';
  else if(text.includes('今天')||text.includes('今日'))s.time_range='今日';
  else s.time_range='最近 30 天';
  s.industry='自动识别中';
  if(text.includes('中标')||text.includes('成交'))s.notice_type='中标公告';
  else if(text.includes('更正'))s.notice_type='更正公告';
  else s.notice_type='招标公告';
  return s;
}
function renderSlots(s){
  return `<div class="slots-card"><div class="slots-title">5 槽位解析结果</div>
    <div class="slots-grid">
      <div class="slot-item"><span class="slot-label">关键词</span><span class="slot-value">${s.keyword||'<span class="slot-empty">未指定</span>'}</span></div>
      <div class="slot-item"><span class="slot-label">地区</span><span class="slot-value">${s.region||'<span class="slot-empty">未指定</span>'}</span></div>
      <div class="slot-item"><span class="slot-label">时间范围</span><span class="slot-value">${s.time_range||'<span class="slot-empty">未指定</span>'}</span></div>
      <div class="slot-item"><span class="slot-label">行业</span><span class="slot-value">${s.industry||'<span class="slot-empty">未指定</span>'}</span></div>
      <div class="slot-item" style="grid-column:span 2;"><span class="slot-label">公告类型</span><span class="slot-value">${s.notice_type||'<span class="slot-empty">未指定</span>'}</span></div>
    </div></div>`;
}

/* ===== 初始化：恢复历史 + 渲染 Agent ===== */
function initChat(){
  const history=loadChatHistory();
  if(history.length===0){
    addMsg('bot',
      '你好！我是标小智。<br><br>'+
      '告诉我你想找什么样的招标项目，我会通过 6 个 Agent 协作帮你：<br>'+
      '1. 理解意图 → 2. 搜集数据 → 3. 清洗处理 →<br>'+
      '4. 质量校验 → 5. 报告生成 → 6. 推送交付<br><br>'+
      '试试输入：<b>"找上海最近7天的IT采购项目"</b>',
      false
    );
  }else{
    history.forEach(m=>addMsg(m.role,m.content,false));
  }
  renderAgents();
  document.getElementById('msgInput').focus();
}
initChat();

function downloadReport(){
  if(_lastReportSid){
    window.location.href='/api/demo/report/download?sid='+encodeURIComponent(_lastReportSid);
    return;
  }
  alert('报告已过期或未生成，请重新输入查询后再下载。');
}
