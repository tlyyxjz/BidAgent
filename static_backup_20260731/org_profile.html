<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=1">
<title>组织画像 · 实体分析</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.header{background:white;padding:16px 24px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:16px}
.back-link{color:#1976d2;text-decoration:none;font-size:14px}
h1{font-size:18px;color:#1a1a2e}
.org-tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#e3f2fd;color:#1565c0}
.main-container{max-width:1200px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:white;border:1px solid #e8e8e8;border-radius:8px;padding:20px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #f0f0f0}
.card-title{font-size:15px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px}
.card-icon{font-size:18px}
.card-more{font-size:12px;color:#999;cursor:pointer}
.card-more:hover{color:#1976d2}
.card-full{grid-column:1/-1}
.org-basic{display:flex;gap:24px;align-items:center}
.org-avatar{width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#1976d2,#1565c0);display:flex;align-items:center;justify-content:center;font-size:28px;color:white;font-weight:bold}
.org-info{flex:1}
.org-name{font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:6px}
.org-meta{display:flex;gap:16px;font-size:13px;color:#666}
.org-meta-item{display:flex;align-items:center;gap:4px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{padding:14px;background:#f8f9ff;border-radius:8px;text-align:center}
.stat-value{font-size:24px;font-weight:700;color:#1a1a2e}
.stat-label{font-size:12px;color:#999;margin-top:4px}
.stat-card.primary .stat-value{color:#1976d2}
.stat-card.success .stat-value{color:#2e7d32}
.stat-card.warning .stat-value{color:#f57c00}
.stat-card.danger .stat-value{color:#c62828}
.chart-container{height:220px;position:relative}
.chart-svg{width:100%;height:100%}
.bar{fill:#1976d2;opacity:.7;transition:opacity .2s}
.bar:hover{opacity:1}
.axis{stroke:#e0e0e0;stroke-width:1}
.axis-label{fill:#999;font-size:10px}
.purchaser-list{display:flex;flex-direction:column;gap:10px}
.purchaser-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fafbfc;border-radius:6px}
.purchaser-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#e3f2fd;color:#1565c0}
.purchaser-rank.r1{background:#ffd54f;color:#e65100}
.purchaser-rank.r2{background:#e0e0e0;color:#616161}
.purchaser-rank.r3{background:#ffccbc;color:#bf360c}
.purchaser-info{flex:1}
.purchaser-name{font-size:13px;font-weight:500;color:#1a1a2e}
.purchaser-count{font-size:12px;color:#999;margin-top:2px}
.purchaser-bar{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin-top:6px}
.purchaser-bar-fill{height:100%;background:linear-gradient(90deg,#1976d2,#42a5f5);border-radius:3px}
.concentration{margin-top:12px;padding:10px 12px;background:#fff8e1;border-radius:6px;display:flex;justify-content:space-between;align-items:center}
.concentration-label{font-size:12px;color:#e65100}
.concentration-value{font-size:16px;font-weight:600;color:#e65100}
.waste-list{display:flex;flex-direction:column;gap:10px}
.waste-item{padding:12px;background:#fff5f5;border-radius:6px;border-left:3px solid #ef5350}
.waste-title{font-size:13px;font-weight:500;color:#1a1a2e;margin-bottom:4px}
.waste-meta{display:flex;gap:12px;font-size:11px;color:#999}
.waste-reason{font-size:12px;color:#c62828;margin-top:6px}
.completeness-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.completeness-item:last-child{border-bottom:none}
.completeness-label{color:#666}
.completeness-value{font-weight:500;color:#1a1a2e}
.completeness-score{text-align:center;padding:16px 0}
.score-circle{width:100px;height:100px;border-radius:50%;background:conic-gradient(#43a047 0% 87.5%,#e0e0e0 87.5% 100%);display:flex;align-items:center;justify-content:center;margin:0 auto}
.score-inner{width:80px;height:80px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-value{font-size:24px;font-weight:700;color:#2e7d32}
.score-label{font-size:11px;color:#999}
.platform-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.platform-tag{padding:2px 8px;background:#e3f2fd;color:#1565c0;border-radius:4px;font-size:11px}
.missing-list{margin-top:8px;padding:8px 12px;background:#fff8e1;border-radius:4px;font-size:12px;color:#e65100}
@media(max-width:900px){.main-container{grid-template-columns:1fr}.stats-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== Stepper 主链路步骤条 ===== */
.stepper{background:white;border-bottom:1px solid #e8e8e8;padding:18px 40px 14px;display:flex;align-items:flex-start;justify-content:center;gap:0;position:sticky;top:0;z-index:9}
.stepper-track{position:absolute;top:34px;left:calc(50% - 480px);width:960px;height:2px;background:#e0e0e0;z-index:0}
.stepper-steps{display:flex;gap:0;width:100%;max-width:960px;position:relative;z-index:1;justify-content:space-between}
.stepper-step{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-decoration:none;flex:1;position:relative}
.stepper-circle{width:36px;height:36px;border-radius:50%;background:#e8eaf6;color:#999;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s ease;border:2px solid transparent;z-index:2}
.stepper-step.active .stepper-circle{background:#1976d2;color:white;border-color:#1565c0;box-shadow:0 0 0 4px rgba(25,118,210,.12)}
.stepper-step.done .stepper-circle{background:#1976d2;color:white}
.stepper-label{font-size:12px;color:#999;font-weight:500;text-align:center;white-space:nowrap;transition:color .2s ease;line-height:1.4}
.stepper-step.active .stepper-label{color:#1565c0;font-weight:700}
.stepper-step.done .stepper-label{color:#555}
.stepper-step:hover .stepper-circle:not(.active){background:#c5cae9;color:#1a1a2e}
.stepper-step:hover .stepper-label{color:#1976d2}
@media(max-width:960px){.stepper{padding:14px 16px 10px}.stepper-label{font-size:10px}.stepper-circle{width:30px;height:30px;font-size:14px}.stepper-track{top:28px}}

/* ===== 组织名称搜索框 ===== */
.org-search-wrap{background:white;border-bottom:1px solid #e8e8e8;padding:14px 40px;display:flex;justify-content:center}
.org-search-box{width:100%;max-width:640px;background:#f8f9ff;border:1px solid #e0e7ff;border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center}
.org-search-icon{width:36px;height:36px;border-radius:8px;background:#e3f2fd;color:#1976d2;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.org-search-input{flex:1;border:none;outline:none;font-size:14px;padding:8px 4px;color:#1a1a2e;background:transparent}
.org-search-input::placeholder{color:#b0b8c4}
.org-search-btn{background:#1976d2;color:white;border:none;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.org-search-btn:hover{background:#1565c0;transform:translateY(-1px)}

/* ===== 6维度信用评分卡 ===== */
.credit-section{grid-column:1/-1;margin-bottom:4px}
.credit-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.credit-score-circle-wrap{flex-shrink:0}
.credit-overall{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
.credit-overall-inner{width:86px;height:86px;border-radius:50%;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center}
.credit-overall-value{font-size:28px;font-weight:800;letter-spacing:-.5px}
.credit-overall-label{font-size:11px;color:#888;margin-top:2px}
.credit-title-area{flex:1}
.credit-title{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:4px}
.credit-subtitle{font-size:13px;color:#666;line-height:1.6}
.credit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.credit-card{background:white;border:1px solid #eef0f5;border-radius:12px;padding:16px 18px;transition:all .15s}
.credit-card:hover{border-color:#1976d2;box-shadow:0 4px 12px rgba(25,118,210,.08)}
.credit-card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.credit-card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;color:white;flex-shrink:0}
.credit-card-name{font-size:13px;font-weight:600;color:#1a1a2e;line-height:1.3}
.credit-card-name small{display:block;font-size:11px;color:#888;font-weight:400;margin-top:2px}
.credit-score-row{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
.credit-score-big{font-size:26px;font-weight:800;letter-spacing:-.5px;color:#1a1a2e}
.credit-score-unit{font-size:13px;color:#888;font-weight:500}
.credit-bar{height:8px;background:#eef0f5;border-radius:4px;overflow:hidden;margin-bottom:10px}
.credit-bar-fill{height:100%;border-radius:4px;transition:width .3s ease}
.credit-desc{font-size:12px;color:#666;line-height:1.6}
@media(max-width:900px){.credit-grid{grid-template-columns:repeat(2,1fr)}}

/* ===== 6维度雷达图（ECharts） ===== */
.credit-radar-wrap{margin-top:20px;background:#fafbfc;border:1px solid #eef0f5;border-radius:12px;padding:20px 24px}
.credit-radar-title{font-size:14px;font-weight:700;color:#1a1a2e;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.credit-radar-title i{color:#1976d2}
@media(max-width:900px){.credit-radar-wrap{padding:14px}}

/* ===== 标小智品牌头 ===== */
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#1a1a2e}
.brand-logo{width:26px;height:26px;background:linear-gradient(135deg,#1976d2,#1565c0);border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-size:13px;font-weight:800}
</style>
<link rel="stylesheet" href="/static/vendor/phosphor/phosphor-icons.min.css" />
<script src="/static/vendor/echarts/echarts.min.js"></script>
</head>
<body>
<!-- 主链路 Stepper（6 步全流程打通） -->
<nav class="stepper" id="mainStepper" aria-label="主链路 6 步流程"></nav>
<!-- 按名称切换组织搜索框 -->
<div class="org-search-wrap">
  <div class="org-search-box">
    <div class="org-search-icon"><i class="ph ph-magnifying-glass" style="color:#1976d2"></i></div>
    <input class="org-search-input" id="orgSearchInput" placeholder="按名称切换组织，例如：北京市教育委员会" />
    <button class="org-search-btn" onclick="switchOrgByName()">切换</button>
  </div>
</div>
<div class="header">
  <div class="header-left">
    <div class="brand"><div class="brand-logo">标</div><span>标小智</span></div>
    <a href="/ui/search" class="back-link"><i class="ph ph-arrow-bend-double-up-right" style="transform:rotate(135deg);display:inline-block"></i> 返回列表</a>
    <div><h1 id="orgName">组织画像</h1></div>
    <span class="org-tag" id="orgType">医疗机构</span>
  </div>
</div>
<div class="main-container">
  <div class="card card-full">
    <div class="org-basic">
      <div class="org-avatar" id="orgAvatar">北</div>
      <div class="org-info">
        <div class="org-name" id="orgNameBig">加载中...</div>
        <div class="org-meta">
          <span class="org-meta-item"><i class="ph ph-map-pin"></i> <span id="orgRegion">--</span></span>
          <span class="org-meta-item"><i class="ph ph-building"></i> <span id="orgType2">--</span></span>
          <span class="org-meta-item"><i class="ph ph-chart-line-up"></i> 数据更新：2026-07-27</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 6维度信用评分卡（最顶部） -->
  <div class="card card-full credit-section" id="creditSection">
    <div class="credit-header">
      <div class="credit-score-circle-wrap">
        <div class="credit-overall" id="creditOverallBg" style="background:conic-gradient(#2e7d32 0% 87.5%,#e0e0e0 87.5% 100%)">
          <div class="credit-overall-inner">
            <div class="credit-overall-value" id="creditOverallValue" style="color:#2e7d32">87.5</div>
            <div class="credit-overall-label">综合信用</div>
          </div>
        </div>
      </div>
      <div class="credit-title-area">
        <div class="credit-title"><i class="ph ph-shield-check" style="color:#2e7d32;margin-right:6px"></i>6 维度信用综合评估</div>
        <div class="credit-subtitle">基于该组织近 90 天公告数据，从合规性、履约能力、交易稳定性、信息透明度、供应商多样性、历史争议 6 个维度加权评分。每一项指标均可溯源至具体公告证据。</div>
      </div>
    </div>
    <div class="credit-grid" id="creditGrid"></div>
    <!-- 6 维度雷达图（ECharts 实现，与其他页面图表风格统一） -->
    <div class="credit-radar-wrap">
      <div class="credit-radar-title"><i class="ph ph-target"></i>6 维度信用雷达图</div>
      <div id="creditRadar" style="width:100%;height:380px;"></div>
    </div>
  </div>

  <div class="card card-full">
    <div class="stats-grid">
      <div class="stat-card primary"><div class="stat-value" id="statTotal">0</div><div class="stat-label">90天公告总数</div></div>
      <div class="stat-card"><div class="stat-value" id="statTender">0</div><div class="stat-label">招标公告</div></div>
      <div class="stat-card success"><div class="stat-value" id="statAward">0</div><div class="stat-label">中标公告</div></div>
      <div class="stat-card danger"><div class="stat-value" id="statWaste">0</div><div class="stat-label">废标关联</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title"><span class="card-icon"><i class="ph ph-chart-line-up" style="color:#2e7d32"></i></span>中标活跃度（90天）</span><span class="card-more">近90天</span></div>
    <div class="chart-container"><svg class="chart-svg" id="activityChart"></svg></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title"><span class="card-icon"><i class="ph ph-trophy" style="color:#f57f17"></i></span>Top3 采购人集中度</span><span class="card-more">全部历史</span></div>
    <div class="purchaser-list" id="purchaserList"></div>
    <div class="concentration">
      <span class="concentration-label">CR3 集中度</span>
      <span class="concentration-value" id="cr3Value">--</span>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title"><span class="card-icon"><i class="ph ph-warning" style="color:#c62828"></i></span>废标关联记录</span><span class="card-more">近半年</span></div>
    <div class="waste-list" id="wasteList"></div>
  </div>

  <div class="card">
    <div class="card-header"><span class="card-title"><span class="card-icon"><i class="ph ph-chart-line-up" style="color:#2e7d32"></i></span>数据完整性说明</span><span class="card-more">数据质量</span></div>
    <div class="completeness-score">
      <div class="score-circle"><div class="score-inner"><div class="score-value" id="scoreValue">--</div><div class="score-label">完整度</div></div></div>
    </div>
    <div id="completenessList"></div>
    <div class="platform-tags" id="platformTags"></div>
    <div class="missing-list" id="missingList"></div>
  </div>
</div>
<script>
function renderMainStepper(){
  const steps=[
    {path:'/ui/search',icon:'ph-magnifying-glass',label:'① 需求检索'},
    {path:'/ui/notice-list',icon:'ph-arrows-split',label:'② 跨平台去重'},
    {path:'/ui/detail',icon:'ph-line-segment',label:'③ 证据验证'},
    {path:'/ui/quality-dashboard#rejects',icon:'ph-x-circle',label:'④ 拒绝与冲突'},
    {path:'/ui/org',icon:'ph-users-three',label:'⑤ 组织画像'},
    {path:'/ui/quality-dashboard',icon:'ph-chart-bar-horizontal',label:'⑥ 评测结果'},
  ];
  const pn=location.pathname;
  const hash=location.hash;
  let activeIdx=4;
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    const sp=s.path.split('#')[0];
    if(pn===sp||pn.startsWith(sp)){
      if(s.path.includes('#')){
        if(hash==='#'+s.path.split('#')[1]){activeIdx=i;break}
      }else{activeIdx=i}
    }
  }
  const el=document.getElementById('mainStepper');
  if(!el)return;
  el.innerHTML='<div class="stepper-track"></div><div class="stepper-steps">'+steps.map((s,i)=>{
    const cls=(i===activeIdx)?' active':(i<activeIdx)?' done':'';
    const href=s.path;
    return `<a class="stepper-step${cls}" href="${href}">
      <div class="stepper-circle"><i class="ph ${s.icon}"></i></div>
      <div class="stepper-label">${s.label}</div>
    </a>`;
  }).join('')+'</div>';
}
renderMainStepper();

function switchOrgByName(){
  const v=(document.getElementById('orgSearchInput').value||'').trim();
  if(!v)return;
  location.search='?name='+encodeURIComponent(v);
}
document.addEventListener('DOMContentLoaded',()=>{
  const p=new URLSearchParams(window.location.search);
  const nm=p.get('name');
  if(nm)document.getElementById('orgSearchInput').value=nm;
});

function creditColor(score){return score>=85?'#2e7d32':score>=70?'#f57f17':'#c62828'}
const _BG_BY_KEY={projects_participated:'#1976d2',total_amount:'#2e7d32',award_win_rate:'#7b1fa2',recent_activity:'#00838f',amount_consistency:'#ef6c00',type_coverage:'#c62828'};
function renderCreditScores(orgData){
  // 对接 /api/org/{name} 真实字段：credit_overall + credit_dimensions
  const dims=orgData&&Array.isArray(orgData.credit_dimensions)?orgData.credit_dimensions:null;
  if(!dims){
    // API 失败时只置空，不再用假数据
    document.getElementById('creditOverallValue').textContent='--';
    document.getElementById('creditOverallValue').style.color='#999';
    document.getElementById('creditGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:#999;padding:40px">信用评分数据加载失败</div>';
    return;
  }
  const overall=orgData.credit_overall!=null?orgData.credit_overall:Math.round(dims.reduce((s,x)=>s+x.score,0)/dims.length*10)/10;
  const c=creditColor(overall);
  const pct=Math.min(overall,100);
  document.getElementById('creditOverallBg').style.background=`conic-gradient(${c} 0% ${pct}%,#e0e0e0 ${pct}% 100%)`;
  const valEl=document.getElementById('creditOverallValue');
  valEl.textContent=overall.toFixed(overall%1===0?0:1);
  valEl.style.color=c;
  document.getElementById('creditGrid').innerHTML=dims.map(s=>{
    const sc=creditColor(s.score);
    const bg=_BG_BY_KEY[s.key]||'#1976d2';
    const name=s.name||s.key;
    const desc=s.description||s.desc||'';
    const disp=s.display||'';
    return `<div class="credit-card">
      <div class="credit-card-head">
        <div class="credit-card-icon" style="background:${bg}"><i class="ph ${s.icon||'ph-circle'}"></i></div>
        <div class="credit-card-name">${name}<small>${disp||'近 90 天数据'}</small></div>
      </div>
      <div class="credit-score-row">
        <span class="credit-score-big" style="color:${sc}">${s.score}</span>
        <span class="credit-score-unit">/ 100</span>
      </div>
      <div class="credit-bar"><div class="credit-bar-fill" style="width:${s.score}%;background:${sc}"></div></div>
      <div class="credit-desc">${desc}</div>
    </div>`;
  }).join('');
  renderCreditRadar(dims, overall);
}

function renderCreditRadar(dims, overall){
  const el=document.getElementById('creditRadar');
  if(!el||!window.echarts||!dims||!dims.length)return;
  const chart=echarts.init(el);
  const indicators=dims.map(d=>({name:d.name||d.key,max:100}));
  const values=dims.map(d=>d.score);
  chart.setOption({
    title:{text:'综合信用 '+((overall!=null)?overall.toFixed(1):'--')+' 分',left:'center',top:6,textStyle:{fontSize:13,color:'#1a1a2e',fontWeight:600}},
    tooltip:{trigger:'item',formatter:p=>{
      const v=p.value;
      const names=dims.map(d=>d.name||d.key);
      return names.map((n,i)=>n+': '+(v[i]!=null?v[i]:'--')).join('<br/>');
    }},
    radar:{
      indicator:indicators,
      radius:'62%',
      center:['50%','55%'],
      splitNumber:4,
      axisName:{color:'#555',fontSize:12},
      splitLine:{lineStyle:{color:'#e0e0e0'}},
      splitArea:{areaStyle:{color:['#fafbfc','#fff']}},
      axisLine:{lineStyle:{color:'#e0e0e0'}}
    },
    series:[{
      type:'radar',
      data:[{
        value:values,
        name:'信用评分',
        areaStyle:{color:'rgba(25,118,210,.20)'},
        lineStyle:{color:'#1976d2',width:2},
        itemStyle:{color:'#1976d2'}
      }]
    }]
  });
  window.addEventListener('resize',()=>{try{chart.resize()}catch(e){}});
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderActivity(daily){
  const svg=document.getElementById('activityChart');
  const w=svg.clientWidth||500,h=220,pad={t:20,r:10,b:30,l:30};
  const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  const max=Math.max(...daily.map(d=>d.count),1);
  const bw=cw/daily.length*0.7;
  let paths='',labels='';
  daily.forEach((d,i)=>{
    const x=pad.l+i*(cw/daily.length)+(cw/daily.length-bw)/2;
    const bh=(d.count/max)*ch;
    const y=pad.t+ch-bh;
    paths+=`<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2"><title>${d.date}: ${d.count} 条</title></rect>`;
    if(i%15===0)labels+=`<text class="axis-label" x="${x+bw/2}" y="${h-8}" text-anchor="middle">${d.date.slice(5)}</text>`;
  });
  svg.innerHTML=`<line class="axis" x1="${pad.l}" y1="${pad.t+ch}" x2="${w-pad.r}" y2="${pad.t+ch}"/>
    <line class="axis" x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${pad.t+ch}"/>
    ${paths}${labels}`;
}
function renderPurchasers(list){
  const el=document.getElementById('purchaserList');
  const max=Math.max(...list.map(p=>p.count),1);
  el.innerHTML=list.map((p,i)=>`<div class="purchaser-item">
    <div class="purchaser-rank r${i+1}">${i+1}</div>
    <div class="purchaser-info">
      <div class="purchaser-name">${esc(p.name)}</div>
      <div class="purchaser-count">${p.count} 条 · ${(p.ratio*100).toFixed(1)}%</div>
      <div class="purchaser-bar"><div class="purchaser-bar-fill" style="width:${(p.ratio*100).toFixed(0)}%"></div></div>
    </div>
  </div>`).join('');
}
function renderWaste(list){
  const el=document.getElementById('wasteList');
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#999;">暂无废标记录</div>';return}
  el.innerHTML=list.map(w=>`<div class="waste-item">
    <div class="waste-title">${esc(w.project_name)}</div>
    <div class="waste-meta"><span><i class="ph ph-calendar"></i> ${w.waste_date}</span></div>
    <div class="waste-reason">废标原因：${esc(w.reason)}</div>
  </div>`).join('');
}
function renderCompleteness(dc){
  document.getElementById('scoreValue').textContent=dc.completeness_score+'%';
  const el=document.getElementById('completenessList');
  el.innerHTML=`<div class="completeness-item"><span class="completeness-label">时间范围</span><span class="completeness-value">${dc.time_range}</span></div>
    <div class="completeness-item"><span class="completeness-label">公告总数</span><span class="completeness-value">${dc.total_notices} 条</span></div>
    <div class="completeness-item"><span class="completeness-label">招标公告</span><span class="completeness-value">${dc.tender_count} 条</span></div>
    <div class="completeness-item"><span class="completeness-label">中标公告</span><span class="completeness-value">${dc.award_count} 条</span></div>
    <div class="completeness-item"><span class="completeness-label">更正公告</span><span class="completeness-value">${dc.correction_count} 条</span></div>`;
  document.getElementById('platformTags').innerHTML=dc.platforms.map(p=>`<span class="platform-tag">${p}</span>`).join('');
  document.getElementById('missingList').innerHTML='<i class="ph ph-warning" style="color:#c62828"></i> 缺失字段：'+dc.missing_fields.join('、');
}
async function loadData(){
  const p=new URLSearchParams(window.location.search);
  const name=p.get('name');
  const oid=p.get('org')||'org_001';
  try{
    let d;
    if(name){
      const r=await fetch(`/api/org/${encodeURIComponent(name)}`);
      if(!r.ok)throw new Error('加载失败');
      d=await r.json();
    }else{
      const r=await fetch(`/api/demo/organizations/${encodeURIComponent(oid)}`);
      if(!r.ok)throw new Error('加载失败');
      d=await r.json();
    }
    if(d.code!==200)throw new Error(d.msg||'加载失败');
    const o=d.data;
    document.getElementById('orgName').textContent=o.org_name;
    document.getElementById('orgNameBig').textContent=o.org_name;
    document.getElementById('orgAvatar').textContent=o.org_name.slice(0,1);
    document.getElementById('orgRegion').textContent=o.region;
    document.getElementById('orgType').textContent=o.org_type;
    document.getElementById('orgType2').textContent=o.org_type;
    const a=o.activity_90d;
    document.getElementById('statTotal').textContent=a.total;
    document.getElementById('statTender').textContent=a.tender_count;
    document.getElementById('statAward').textContent=a.award_count;
    document.getElementById('statWaste').textContent=o.waste_bid_count;
    document.getElementById('cr3Value').textContent=(o.top3_concentration*100).toFixed(1)+'%';
    renderActivity(a.daily);
    renderPurchasers(o.top3_purchasers);
    renderWaste(o.waste_bid_related);
    renderCompleteness(o.data_completeness);
    renderCreditScores(o);
  }catch(e){
    renderCreditScores(null);
    document.querySelector('.main-container').innerHTML='<div style="text-align:center;padding:60px;color:#999;">加载失败: '+e.message+'</div>';
  }
}
loadData();
</script>
