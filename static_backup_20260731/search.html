<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=1">
<title>标讯检索 · 标小智</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.header{background:white;padding:12px 24px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#1a1a2e}
.brand-logo{width:28px;height:28px;background:linear-gradient(135deg,#1976d2,#1565c0);border-radius:6px;display:flex;align-items:center;justify-content:center;color:white;font-size:14px;font-weight:800}
.nav{display:flex;gap:4px}
.nav a{padding:6px 14px;text-decoration:none;color:#555;font-size:13px;border-radius:6px;transition:all .15s}
.nav a:hover{background:#f0f4ff;color:#1976d2}
.nav a.active{background:#e3f2fd;color:#1565c0;font-weight:600}
.page-main{max-width:1180px;margin:0 auto;padding:32px 24px 80px}
.hero{background:linear-gradient(135deg,#1976d2 0%,#4527a0 100%);border-radius:16px;padding:40px 44px;color:white;margin-bottom:28px;box-shadow:0 8px 24px rgba(25,118,210,.18)}
.hero h1{font-size:28px;margin-bottom:10px;letter-spacing:.5px}
.hero p{opacity:.9;font-size:14px;line-height:1.7;max-width:720px}
.search-box{background:white;border-radius:14px;padding:18px;margin-top:28px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.search-icon{width:40px;height:40px;border-radius:10px;background:#e3f2fd;color:#1976d2;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.search-input{flex:1;border:none;outline:none;font-size:15px;padding:10px 4px;color:#1a1a2e;background:transparent}
.search-input::placeholder{color:#b0b8c4}
.search-btn{background:#1976d2;color:white;border:none;padding:12px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.search-btn:hover{background:#1565c0;transform:translateY(-1px)}
.filters-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:28px}
.filter-card{background:white;border:1px solid #e8e8e8;border-radius:12px;padding:14px 16px;transition:all .15s}
.filter-card:hover{border-color:#1976d2;box-shadow:0 4px 12px rgba(25,118,210,.08)}
.filter-label{font-size:11px;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.filter-value{font-size:14px;font-weight:600;color:#1a1a2e;display:flex;justify-content:space-between;align-items:center}
.filter-select{width:100%;border:1px solid #e8e8e8;border-radius:8px;padding:8px 10px;font-size:13px;background:white;color:#1a1a2e;outline:none;cursor:pointer}
.filter-select:focus{border-color:#1976d2}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title h2{font-size:16px;color:#1a1a2e}
.section-title .count{font-size:12px;color:#888;background:#eef0f8;padding:4px 10px;border-radius:10px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:white;border:1px solid #eef0f5;border-radius:12px;padding:18px 20px}
.stat-card h3{font-size:12px;color:#888;font-weight:500;margin-bottom:8px}
.stat-card .num{font-size:24px;font-weight:700;color:#1a1a2e;letter-spacing:-.5px}
.stat-card .num .unit{font-size:13px;font-weight:500;color:#888;margin-left:4px}
.stat-card .trend{font-size:12px;color:#2e7d32;margin-top:4px}
.stat-card .trend.down{color:#c62828}
.result-list{background:white;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden}
.result-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:grid;grid-template-columns:60px 1fr 100px 140px 120px;gap:16px;font-size:12px;color:#888;font-weight:600;background:#fafbfc}
.result-item{padding:16px 20px;border-bottom:1px solid #f5f5f5;display:grid;grid-template-columns:60px 1fr 100px 140px 120px;gap:16px;align-items:center;transition:background .15s;cursor:pointer}
.result-item:last-child{border-bottom:none}
.result-item:hover{background:#f8f9ff}
.seq{font-size:12px;color:#999;font-family:monospace;font-weight:600}
.res-title{font-size:14px;font-weight:600;color:#1a1a2e;line-height:1.5;margin-bottom:4px}
.res-meta{font-size:12px;color:#888;display:flex;gap:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.tag-tender{background:#e3f2fd;color:#1565c0}
.tag-award{background:#e8f5e9;color:#2e7d32}
.tag-correction{background:#fff8e1;color:#f57f17}
.amount{font-size:14px;font-weight:700;color:#1976d2;text-align:right}
.date{font-size:12px;color:#888;text-align:right}
.grade{text-align:center;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;display:inline-block;margin:0 auto}
.grade-high{background:#e8f5e9;color:#2e7d32}
.grade-review{background:#fff8e1;color:#f57f17}
.grade-low{background:#ffebee;color:#c62828}
.empty-state{padding:60px 20px;text-align:center;color:#999}
.empty-state .emoji{font-size:42px;margin-bottom:12px}

/* ===== Stepper 主链路步骤条 ===== */
.stepper{background:white;border-bottom:1px solid #e8e8e8;padding:18px 40px 14px;display:flex;align-items:flex-start;justify-content:center;gap:0;position:sticky;top:0;z-index:9}
.stepper-track{position:absolute;top:34px;left:calc(50% - 480px);width:960px;height:2px;background:#e0e0e0;z-index:0}
.stepper-steps{display:flex;gap:0;width:100%;max-width:960px;position:relative;z-index:1;justify-content:space-between}
.stepper-step{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-decoration:none;flex:1;position:relative}
.stepper-circle{width:36px;height:36px;border-radius:50%;background:#e8eaf6;color:#999;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s ease;border:2px solid transparent;z-index:2}
.stepper-step.active .stepper-circle{background:#1976d2;color:white;border-color:#1565c0;box-shadow:0 0 0 4px rgba(25,118,210,.12)}
.stepper-step.done .stepper-circle{background:#1976d2;color:white}
.stepper-label{font-size:12px;color:#999;font-weight:500;text-align:center;white-space:nowrap;transition:color .2s ease;line-height:1.4}
.stepper-step.active .stepper-label{color:#1565c0;font-weight:700}
.stepper-step.done .stepper-label{color:#555}
.stepper-step:hover .stepper-circle:not(.active){background:#c5cae9;color:#1a1a2e}
.stepper-step:hover .stepper-label{color:#1976d2}
@media(max-width:960px){.stepper{padding:14px 16px 10px}.stepper-label{font-size:10px}.stepper-circle{width:30px;height:30px;font-size:14px}.stepper-track{top:28px}}
</style>
<link rel="stylesheet" href="/static/vendor/phosphor/phosphor-icons.min.css" />
</head>
<body>
<!-- 主链路 Stepper（6 步全流程打通） -->
<nav class="stepper" id="mainStepper" aria-label="主链路 6 步流程"></nav>
<header class="header">
  <div class="header-left">
    <div class="brand"><div class="brand-logo">标</div>标小智</div>
    <nav class="nav">
      <a href="/ui/search" class="active">检索</a>
      <a href="/ui/notice-list">公告</a>
      <a href="/ui/detail">详情</a>
      <a href="/ui/quality-dashboard">评测</a>
      <a href="/ui/org">画像</a>
    </nav>
  </div>
  <div style="font-size:12px;color:#888;display:flex;align-items:center;gap:8px">
    <span id="dataSourceBadge" style="padding:2px 10px;border-radius:4px;background:#f3f4f6;color:#888;font-weight:600;"><i class="ph ph-hourglass"></i> 加载中...</span>
    <span>用户模式 · Demo</span>
  </div>
</header>
<main class="page-main">
  <section class="hero">
    <h1><i class="ph ph-magnifying-glass" style="color:#1976d2"></i> 跨平台招投标智能检索</h1>
    <p>一句话输入需求，标小智 六 Agent 协同闭环：意图解析 → 跨 4 平台采集 → 去重合并 → 逐字段证据校验 → 供应商画像 → Word 报告。每个数字都能点回公告原文。</p>
    <div class="search-box">
      <div class="search-icon"><i class="ph ph-magnifying-glass" style="color:#1976d2"></i></div>
      <input class="search-input" id="searchInput" placeholder="例如：上海最近7天的IT采购项目，预算100万以上" />
      <button class="search-btn" onclick="runSearch()">开始检索</button>
    </div>
  </section>

  <section class="stats-grid" id="statsGrid"></section>

  <div class="filters-row">
    <div class="filter-card">
      <div class="filter-label">公告类型</div>
      <select class="filter-select" id="fType">
        <option value="">全部类型</option>
        <option value="招标公告">招标公告</option>
        <option value="中标公告">中标公告</option>
        <option value="更正公告">更正公告</option>
      </select>
    </div>
    <div class="filter-card">
      <div class="filter-label">时间范围</div>
      <select class="filter-select" id="fDate">
        <option value="7d">最近 7 天</option>
        <option value="30d" selected>最近 30 天</option>
        <option value="90d">最近 90 天</option>
        <option value="1y">最近一年</option>
      </select>
    </div>
    <div class="filter-card">
      <div class="filter-label">数据质量</div>
      <select class="filter-select" id="fGrade">
        <option value="">全部等级</option>
        <option value="high">仅 HIGH（有强证据）</option>
        <option value="review">含 REVIEW</option>
        <option value="low">含 LOW</option>
      </select>
    </div>
    <div class="filter-card">
      <div class="filter-label">来源平台</div>
      <select class="filter-select" id="fPlat">
        <option value="">全部平台</option>
        <option>中国政府采购网</option>
        <option>全国公共资源交易平台</option>
        <option>千里马招标网</option>
        <option>北京市政府采购网</option>
      </select>
    </div>
  </div>

  <div class="section-title">
    <h2><i class="ph ph-list-dashes"></i> 检索结果</h2>
    <span class="count" id="resCount">0 条</span>
  </div>
  <div class="result-list">
    <div class="result-header">
      <div>#</div><div>项目 / 来源</div><div>类型</div><div>金额</div><div>发布</div>
    </div>
    <div id="resultList"></div>
  </div>
</main>
<script>
function renderMainStepper(){
  const steps=[
    {path:'/ui/search',icon:'ph-magnifying-glass',label:'① 需求检索'},
    {path:'/ui/notice-list',icon:'ph-arrows-split',label:'② 跨平台去重'},
    {path:'/ui/detail',icon:'ph-line-segment',label:'③ 证据验证'},
    {path:'/ui/quality-dashboard#rejects',icon:'ph-x-circle',label:'④ 拒绝与冲突'},
    {path:'/ui/org',icon:'ph-users-three',label:'⑤ 组织画像'},
    {path:'/ui/quality-dashboard',icon:'ph-chart-bar-horizontal',label:'⑥ 评测结果'},
  ];
  const pn=location.pathname;
  const hash=location.hash;
  let activeIdx=0;
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    const sp=s.path.split('#')[0];
    if(pn===sp||pn.startsWith(sp)){
      if(s.path.includes('#')){
        if(hash===s.path.split('#')[1]){activeIdx=i;break}
      }else{activeIdx=i}
    }
  }
  const el=document.getElementById('mainStepper');
  if(!el)return;
  el.innerHTML='<div class="stepper-track"></div><div class="stepper-steps">'+steps.map((s,i)=>{
    const cls=(i===activeIdx)?' active':(i<activeIdx)?' done':'';
    const href=s.path;
    return `<a class="stepper-step${cls}" href="${href}">
      <div class="stepper-circle"><i class="ph ${s.icon}"></i></div>
      <div class="stepper-label">${s.label}</div>
    </a>`;
  }).join('')+'</div>';
}
renderMainStepper();

const FL={招标公告:'tag-tender',中标公告:'tag-award',更正公告:'tag-correction'};

// ===== Mock 数据（作为 fallback 保留） =====
const MOCK_RESULTS=[
  {title:'北京大学第三医院信息化系统建设及医疗设备采购项目',purchaser:'北京大学第三医院',plat:'中国政府采购网',type:'招标公告',amount:12000000,date:'2026-07-20',grade:'high'},
  {title:'上海市教育委员会智慧校园设备集中采购',purchaser:'上海市教育委员会',plat:'全国公共资源交易平台',type:'招标公告',amount:5680000,date:'2026-07-19',grade:'high'},
  {title:'北京协和医院手术机器人采购中标结果公告',purchaser:'北京协和医院',plat:'中国政府采购网',type:'中标公告',amount:32800000,date:'2026-07-18',grade:'high'},
  {title:'中关村科技园办公网络改造项目招标公告',purchaser:'中关村科技园管委会',plat:'北京市政府采购网',type:'招标公告',amount:1980000,date:'2026-07-17',grade:'review'},
  {title:'深圳卫健委医疗信息化二期项目更正公告',purchaser:'深圳市卫生健康委员会',plat:'千里马招标网',type:'更正公告',amount:9800000,date:'2026-07-16',grade:'review'},
  {title:'广州地铁安防设备采购项目中标结果',purchaser:'广州地铁集团',plat:'全国公共资源交易平台',type:'中标公告',amount:14500000,date:'2026-07-15',grade:'low'},
  {title:'成都市政府云计算服务采购项目',purchaser:'成都市大数据中心',plat:'中国政府采购网',type:'招标公告',amount:24000000,date:'2026-07-14',grade:'high'},
  {title:'杭州未来科技城办公楼装修项目',purchaser:'杭州未来科技城管委会',plat:'千里马招标网',type:'招标公告',amount:7800000,date:'2026-07-13',grade:'review'},
];

// ===== 数据源状态：'loading' | 'real' | 'mock' =====
let dataSource='loading';
// 当前展示的数据（真实或 Mock）
let currentData=MOCK_RESULTS;

// notice_type 原始值 → 中文标签映射
function mapType(t){
  if(!t) return '未知';
  const s=String(t).toLowerCase();
  if(s.includes('tender')||s==='招标') return '招标公告';
  if(s.includes('award')||s==='中标') return '中标公告';
  if(s.includes('correction')||s.includes('correct')||s==='更正') return '更正公告';
  return '其他';
}

function fmt(n){if(n>=1e8)return (n/1e8).toFixed(2)+' 亿';if(n>=1e4)return (n/1e4).toFixed(0)+' 万';return n.toLocaleString()}
function renderStats(list){
  const total=list.length;
  const amt=list.reduce((s,x)=>s+(x.amount||0),0);
  const high=list.filter(x=>x.grade==='high').length;
  const plats=new Set(list.map(x=>x.plat)).size;
  const cards=[
    {h:'命中项目',n:total,u:'个',t:'',d:false},
    {h:'累计金额',n:fmt(amt),u:'',t:'',d:false},
    {h:'高质量字段',n:high+'/'+total,u:'',t:total?Math.round(high/total*100)+'% HIGH':'',d:false},
    {h:'来源平台',n:plats,u:'个',t:'跨平台去重合并',d:false},
  ];
  document.getElementById('statsGrid').innerHTML=cards.map(c=>`
    <div class="stat-card"><h3>${c.h}</h3><div class="num">${c.n}<span class="unit">${c.u}</span></div>
      ${c.t?`<div class="trend ${c.d?'down':''}">${c.t}</div>`:''}</div>`).join('');
}
function renderList(list){
  if(!list.length){document.getElementById('resultList').innerHTML=`<div class="empty-state"><div class="emoji"><i class="ph ph-magnifying-glass" style="color:#999"></i></div><div>未找到匹配项</div></div>`;return}
  document.getElementById('resCount').textContent=list.length+' 条';
  document.getElementById('resultList').innerHTML=list.map((x,i)=>`
    <div class="result-item" onclick="goDetail(${i})">
      <div class="seq">${String(i+1).padStart(2,'0')}</div>
      <div><div class="res-title">${x.title}</div><div class="res-meta"><span><i class="ph ph-building"></i> ${x.purchaser}</span><span><i class="ph ph-globe"></i> ${x.plat}</span></div></div>
      <div><span class="tag ${FL[x.type]||'tag-tender'}">${x.type}</span></div>
      <div class="amount">${x.amount?fmt(x.amount):'—'}</div>
      <div class="date">${x.date}</div>
    </div>`).join('');
}
function goDetail(i){
  // 真实数据走真实 id，Mock 走原 Demo 路径
  const item=currentData[i];
  if(item&&item.id){location.href='/ui/detail?id='+item.id}
  else{location.href='/ui/detail?doc=tender_00'+(i+1)}
}

// ===== 数据源标识 =====
function updateDataSourceBadge(){
  const badge=document.getElementById('dataSourceBadge');
  if(!badge) return;
  if(dataSource==='loading'){
    badge.innerHTML='<i class="ph ph-hourglass" style="color:#888"></i> 加载中...';
    badge.style.color='#888';
    badge.style.background='#f3f4f6';
  }else if(dataSource==='real'){
    badge.innerHTML='<i class="ph ph-chart-line-up" style="color:#2e7d32"></i> 真实数据';
    badge.style.color='#16a34a';
    badge.style.background='#dcfce7';
  }else{
    badge.innerHTML='<i class="ph ph-warning" style="color:#c62828"></i> 模拟数据(API未连接)';
    badge.style.color='#dc2626';
    badge.style.background='#fee2e2';
  }
}

// ===== 加载真实数据，失败回退 Mock =====
async function loadRealData(){
  try{
    const resp=await fetch('/api/real/tenders');
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    if(data.code && data.code!==200) throw new Error(data.msg||'API错误');
    const tenders=(data.data && data.data.tenders)||data.tenders||[];
    if(!tenders.length) throw new Error('无数据');
    dataSource='real';
    return tenders.map(t=>{
      // 解析 amount（字符串数字可能含逗号/单位）
      let amt=0;
      if(t.amount){
        const m=String(t.amount).replace(/[^\d.]/g,'');
        if(m) amt=parseFloat(m);
      }
      const plat=t.platform||'真实数据库';
      const grade=amt>0?'high':'review';
      return {
        id:t.id,
        title:t.name||t.project_name||'未命名公告',
        purchaser:t.purchaser||'—',
        plat:plat,
        type:mapType(t.type||t.notice_type),
        amount:amt,
        date:t.publish_date||'—',
        grade:grade
      };
    });
  }catch(e){
    console.warn('真实数据加载失败,使用Mock:',e.message);
    dataSource='mock';
    return MOCK_RESULTS;
  }
}

function runSearch(){
  const k=(document.getElementById('searchInput').value||'').trim();
  const t=document.getElementById('fType').value;
  const g=document.getElementById('fGrade').value;
  let list=currentData.slice();
  if(k)list=list.filter(x=>(x.title+x.purchaser).toLowerCase().includes(k.toLowerCase()));
  if(t)list=list.filter(x=>x.type===t);
  if(g)list=list.filter(x=>x.grade===g);
  renderStats(list);renderList(list);
}
document.getElementById('fType').onchange=runSearch;
document.getElementById('fGrade').onchange=runSearch;

// 初始用 Mock 渲染（避免页面空白），随后尝试加载真实数据
runSearch();
updateDataSourceBadge();
loadRealData().then(data=>{
  currentData=data;
  updateDataSourceBadge();
  runSearch();
});
</script>
</body>
</html>
