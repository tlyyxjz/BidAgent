name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest + coverage + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest-cov pytest-timeout pytest-rerunfailures

      - name: Install optional report deps
        # reportlab / matplotlib 是 scripts/ 报告导出的可选依赖（不进主依赖树）。
        # 必须**真装上**：否则 tests/test_dd_report.py 里两个用例会被 importorskip
        # 静默跳过，变成「CI 绿了但用例根本没跑」的假绿。装后断言导入成功。
        run: |
          pip install -r requirements-report.txt
          python -c "import reportlab, matplotlib; print('report deps ready')"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Prepare data dir
        run: mkdir -p data

      - name: Run test suite (coverage >= 40%)
        run: >
          python -m pytest -q
          --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40
          --ignore=tests/test_rate_limit_extra.py
          --ignore=tests/test_rate_limiter.py
          --ignore=tests/test_e2e_pages.py
          --ignore=tests/test_e2e_flow.py
          --timeout=180 --timeout-method=signal
          --reruns 2 --reruns-delay 1


      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
