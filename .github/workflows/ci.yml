name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest + coverage + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit pytest-cov pytest-timeout pytest-rerunfailures

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Prepare data dir
        run: mkdir -p data

      - name: Run test suite (coverage >= 40%)
        env:
          # CI 占位密钥：仅满足 app/config.py 启动校验，非真实凭证
          SECRET_KEY: 3d72a9cb60434cc461de316f9784fbacc311fdfddbccfbaf16933129d7d9038a
          ADMIN_SECRET: ci-dummy-admin-secret
        run: >
          python -m pytest -q
          --cov=app --cov-report=term --cov-report=xml --cov-fail-under=40
          --ignore=tests/test_rate_limit_extra.py
          --ignore=tests/test_rate_limiter.py
          --ignore=tests/test_e2e_pages.py
          --ignore=tests/test_e2e_flow.py
          --timeout=180 --timeout-method=thread
          --reruns 2 --reruns-delay 1


      - name: Dependency vulnerability scan
        run: pip-audit --requirement requirements.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
